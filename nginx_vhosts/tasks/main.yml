---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Create web root directories
  file:
    path: "/var/www/{{ item }}/html"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop: "{{ sites }}"

- name: Deploy index.html for each site
  template:
    src: index.html.j2
    dest: "/var/www/{{ item }}/html/index.html"
    owner: www-data
    group: www-data
    mode: '0644'
  loop: "{{ sites }}"
  notify: restart nginx

- name: Deploy nginx config for each site
  template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ item }}.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ sites }}"
  notify: restart nginx

- name: Enable sites (symlink to sites-enabled)
  file:
    src: "/etc/nginx/sites-available/{{ item }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: link
  loop: "{{ sites }}"
  notify: restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx
